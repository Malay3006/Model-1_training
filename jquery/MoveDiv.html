<!DOCTYPE html>
<html>
<head>
    <title>Move Div</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #box1, #box2 {
            width: 200px;
            min-height: 100px;
            border: 2px solid black;
            margin: 10px;
            padding: 10px;
        }

        #smallBox {
            background: orange;
            padding: 10px;
        }
    </style>
</head>
<body>

<div id="box1">
    <div id="smallBox">
        Move Me
    </div>
</div>

<div id="box2">
    Destination Box
</div>

<button id="moveBtn">Move Div</button>

<script>
$(document).ready(function(){

    $("#moveBtn").click(function(){

        $("#smallBox").appendTo("#box2");

    });

});
</script>

</body>
</html>
